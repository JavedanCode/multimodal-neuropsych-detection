# ======================================================================
# E-DAIC depression screening — default experiment configuration
# All paths are relative to the repository root unless absolute.
# Local overrides: copy this file to configs/local.yaml (gitignored), then pass --config.
# ======================================================================

seed: 42

paths:
  # Root of the downloaded E-DAIC release (275 participant *.tar.gz + labels).
  data_root: data/raw
  manifest: data/manifests/dataset_manifest.json
  audit_report: reports/data_audit/audit.md
  interim: data/interim          # selectively extracted feature files
  processed: data/processed      # model-ready Parquet tables
  models: models
  evaluation: reports/evaluation

labels:
  # Column availability verified locally; target derivation remains unresolved.
  id_column: Participant_ID
  target_column: PHQ_Binary
  split_files:
    train: train_split.csv
    dev: dev_split.csv
    test: test_split.csv
  # Columns that must never be used as predictive features in the
  # primary experiment (identifiers, demographics, questionnaire
  # answers, alternative targets).
  forbidden_feature_columns:
    - PHQ_Binary
    - Participant_ID
    - Gender
    - PHQ_Score
    - PCL-C (PTSD)
    - PTSD Severity
    - PHQ_8NoInterest
    - PHQ_8Depressed
    - PHQ_8Sleep
    - PHQ_8Tired
    - PHQ_8Appetite
    - PHQ_8Failure
    - PHQ_8Concentrating
    - PHQ_8Moving
    - PHQ_8Total

inventory:
  deep_scan: false          # stream-decompress archives to list members (slow)
  deep_scan_cache: data/manifests/archive_members.json

# Stage 3: fixed before evaluating any classifier.
aggregation:
  chunk_rows: 10000
  confidence_threshold: 0.8
  workers: 2

# Stage 4 uses released labels provisionally; official test remains unevaluated.
baselines:
  target_policy: released_binary_provisional
  seeds: [42, 137, 2026]  # first is primary; never pick the best seed
  folds: 5
  c_values: [0.01, 0.1, 1.0]
  class_weights: [null, balanced]

# Stage 5: representation-only adaptive gate; fixed before evaluation.
adaptive:
  target_policy: released_binary_provisional
  seeds: [42, 137, 2026]
  folds: 5
  device: auto
  hidden_dim: 16
  dropout: 0.2
  learning_rate: 0.001
  epochs: [50, 100]
  weight_decays: [0.001, 0.01]
