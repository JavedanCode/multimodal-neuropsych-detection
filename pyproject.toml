[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-neuropsych-detection"
version = "0.1.0"
description = "Research framework: BHHO-optimized multimodal depression screening on E-DAIC (facial + acoustic biomarkers)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "For academic use only" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=14",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
neural = ["torch==2.7.1"]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
edaic-inventory = "src.dataset.inventory:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
